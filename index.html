<body>

<div id="boot" class="boot">
  <div class="boot__inner">
    <div class="boot__mark" aria-hidden="true">
      <span class="boot__bar boot__bar--a"></span>
      <span class="boot__bar boot__bar--b"></span>
      <span class="boot__bar boot__bar--c"></span>
    </div>
    <div class="boot__word">magicianed</div>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="rail" id="rail">
    <div class="rail__top">
      <a class="brand" href="#/dashboard" data-nav>
        <span class="brand__mark" aria-hidden="true">
          <i class="brand__seg brand__seg--pgm"></i>
          <i class="brand__seg brand__seg--pvw"></i>
        </span>
        <span class="brand__text">magicianed</span>
      </a>
      <button class="rail__close" id="railClose" aria-label="Close menu">&times;</button>
    </div>

    <div class="rail__user" id="railUser"></div>

    <nav class="rail__nav" id="railNav" aria-label="Course modules"></nav>

    <div class="rail__foot">
      <a class="rail__link" href="#/walkthrough" data-nav><span class="dot dot--cyan"></span>Setup walkthrough</a>
      <a class="rail__link" href="#/reference" data-nav><span class="dot dot--blue"></span>Cheat sheet</a>
      <a class="rail__link" href="#/certificate" data-nav><span class="dot dot--purple"></span>Certificate</a>
      <button class="rail__link rail__link--btn" id="resetBtn"><span class="dot dot--red"></span>Reset progress</button>
    </div>
  </aside>

  <div class="rail__scrim" id="railScrim"></div>

  <main class="main" id="main">
    <header class="topbar">
      <button class="topbar__menu" id="railOpen" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar__crumbs" id="crumbs"></div>
      <div class="topbar__right">
        <div class="xpmeter" id="xpmeter" title="Course progress">
          <svg viewBox="0 0 36 36" class="xpmeter__ring" aria-hidden="true">
            <circle class="xpmeter__track" cx="18" cy="18" r="15.5"></circle>
            <circle class="xpmeter__fill" cx="18" cy="18" r="15.5"></circle>
          </svg>
          <span class="xpmeter__num" id="xpnum">0%</span>
        </div>
      </div>
    </header>
    <div class="view" id="view" tabindex="-1"></div>
  </main>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modalRoot" class="modal-root" hidden></div>

<script src="assets/js/lib/pdf.js?v=4"></script>
